spring:
  application:
    name: expense-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expense}
    username: ${DB_USER:expense}
    password: ${DB_PASSWORD:expense}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  pubsub:
    # No defaults on purpose: a missing value must fail at startup, not reject every real token.
    audience: ${PUBSUB_AUDIENCE}
    service-account: ${PUBSUB_SERVICE_ACCOUNT}
